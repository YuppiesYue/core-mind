<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Skills Chat Test</title>
  <link rel="stylesheet" href="agent-skills-chat-test.css" />
</head>
<body>
  <main class="page">
    <header class="chat-header">
      <div>
        <h1>Agent Chat 流式对话</h1>
        <p class="subtitle">展示思考、工具调用、工具返回与回复</p>
      </div>
      <div class="header-actions">
        <span id="elapsedTime" class="section-meta">0.0s</span>
        <span id="eventCount" class="section-meta">0 events</span>
        <span id="status" class="status">空闲</span>
        <button id="clearBtn" class="icon-button secondary" type="button" aria-label="清空对话" title="清空对话">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5"/><path d="M14 11v5"/></svg>
        </button>
      </div>
    </header>

    <section class="conversation" aria-label="对话流">
      <div id="trace" class="trace">
        <div class="empty-state">发送问题后，这里会展示接口流式返回。</div>
      </div>
    </section>

    <section class="composer" aria-label="发送消息">
      <form id="chatForm">
        <div class="field-grid">
          <div>
            <label for="sessionId">会话 ID</label>
            <input id="sessionId" name="sessionId" />
          </div>
          <div>
            <label for="userId">用户 ID</label>
            <input id="userId" name="userId" value="test-user" />
          </div>
        </div>

        <div class="message-composer">
          <label class="sr-only" for="prompt">用户问题</label>
          <textarea id="prompt" name="prompt" rows="1">我想买个20万的宝马。</textarea>
          <button id="sendBtn" class="icon-button primary" type="submit" aria-label="发送" title="发送">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
          <button id="stopBtn" class="icon-button danger" type="button" aria-label="停止" title="停止" disabled hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="agent-skills-chat-test.js"></script>
</body>
</html>
